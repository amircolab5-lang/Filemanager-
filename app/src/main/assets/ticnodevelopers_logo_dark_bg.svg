    <!-- Bottom Curly Bracket (90 deg rotated with inward legs) -->
    <path
      d="M 72 302 L 72 362 C 72 386 90 400 116 400 L 198 400 C 222 400 238 414 248 436 C 252 444 260 444 264 436 C 274 414 290 400 314 400 L 396 400 C 422 400 440 386 440 362 L 440 302"
      stroke="#FFFFFF"
