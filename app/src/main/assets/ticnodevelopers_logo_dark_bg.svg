<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 1:1 Square Solid Black Background -->
  <rect width="512" height="512" fill="#000000" />

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=League+Spartan:wght@800;900&amp;display=swap');
      .brand-title {
        font-family: 'League Spartan', 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 44px;
        font-weight: 800;
        letter-spacing: 1px;
        fill: #FFFFFF;
        stroke: #FFFFFF;
        stroke-width: 1.8;
        paint-order: stroke fill;
        text-anchor: middle;
        dominant-baseline: central;
      }
    </style>
  </defs>

  <g id="ticnodevelopers_brand_logo">
    <!-- Top Curly Bracket (90 deg rotated with inward legs) -->
    <path
