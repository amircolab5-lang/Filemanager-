  <rect y="200" width="800" height="200" fill="white"/>
  
  <!-- TICNO Text - White on Black -->
  <text x="400" y="145" font-family="Arial Black, Helvetica, sans-serif" 
        font-size="140" font-weight="900" fill="white" 
