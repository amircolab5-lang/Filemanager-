<svg id="ticnoLogoSvg" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 560" width="100%" height="100%" class="max-w-[700px] h-auto drop-shadow-2xl">
    <defs>
        <!-- Standalone Font Import for Universal SVG Compatibility across browsers/viewers -->
        <style type="text/css">
            @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&amp;display=swap');
            .ticno-text-main {
                font-family: 'Montserrat', 'Orbitron', 'Rajdhani', -apple-system, sans-serif;
                font-weight: 900;
                font-size: 40px;
                letter-spacing: 6px;
                text-transform: uppercase;
            }
            .ticno-text-sub {
                font-family: 'Montserrat', -apple-system, sans-serif;
                font-weight: 800;
                font-size: 14px;
                letter-spacing: 10px;
                text-transform: uppercase;
            }
        </style>

        <!-- Filter effects for 3D depth and glow -->
        <filter id="subtleGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#76c028" flood-opacity="0.18"></feDropShadow>
        </filter>
        
        <filter id="purpleGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#8a1ce8" flood-opacity="0.25"></feDropShadow>
        </filter>

        <filter id="textReadabilityShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"></feDropShadow>
        </filter>

        <!-- Lime / Green 3D Gradients -->
        <!-- Top Highlight Bevel -->
        <linearGradient id="limeBrightTop" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#83c81e"></stop>
            <stop offset="40%" stop-color="#b8f236"></stop>
            <stop offset="100%" stop-color="#e2ff78"></stop>
        </linearGradient>

        <!-- Main Upper Arm Front Face -->
        <linearGradient id="limeMidFront" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8fd322"></stop>
            <stop offset="60%" stop-color="#67aa12"></stop>
            <stop offset="100%" stop-color="#4e870a"></stop>
        </linearGradient>

        <!-- Lower Arm Front Face -->
        <linearGradient id="limeShadowFront" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#5fa10f"></stop>
            <stop offset="60%" stop-color="#3f7306"></stop>
            <stop offset="100%" stop-color="#2a5202"></stop>
        </linearGradient>

        <!-- Outer Bottom Bevel Strip -->
        <linearGradient id="limeBottomBevel" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#9ce327"></stop>
            <stop offset="50%" stop-color="#5f9e0d"></stop>
            <stop offset="100%" stop-color="#2f5703"></stop>
        </linearGradient>

        <!-- Inner Dark Bevel Face -->
        <linearGradient id="limeInnerDark" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#2c5404"></stop>
            <stop offset="100%" stop-color="#152d00"></stop>
        </linearGradient>

        <!-- UNIVERSAL HIGH-CONTRAST PURPLE GRADIENT FOR TEXT -->
        <!-- Perfectly balanced tone that works on White, Black, and Dark Navy -->
        <linearGradient id="purpleTextGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#8411d6"></stop>
            <stop offset="45%" stop-color="#a82bf2"></stop>
            <stop offset="100%" stop-color="#710ab8"></stop>
        </linearGradient>

        <!-- Purple Center Pillar 3D Gradients -->
        <!-- Top Cap Highlight -->
        <linearGradient id="purpleTopCap" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#bd81f0"></stop>
            <stop offset="50%" stop-color="#e3beff"></stop>
            <stop offset="100%" stop-color="#f5e6ff"></stop>
        </linearGradient>

        <!-- Left Shadow Face -->
        <linearGradient id="purpleLeftShadow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#642b9e"></stop>
            <stop offset="60%" stop-color="#3d1469"></stop>
            <stop offset="100%" stop-color="#230642"></stop>
        </linearGradient>

        <!-- Right Bright Front Face -->
        <linearGradient id="purpleRightBright" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ce8aff"></stop>
            <stop offset="50%" stop-color="#9a4ee3"></stop>
            <stop offset="100%" stop-color="#6422a8"></stop>
        </linearGradient>

        <!-- Bottom Shadow Cap -->
        <linearGradient id="purpleBottomDark" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#3d1469"></stop>
            <stop offset="100%" stop-color="#18022b"></stop>
        </linearGradient>

        <!-- White Text Color Gradient -->
        <linearGradient id="whiteTextGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#FFFFFF"></stop>
            <stop offset="100%" stop-color="#E2E8F0"></stop>
        </linearGradient>
    </defs>

    <!-- LOGO MARK GROUP -->
    <g id="logoMarkGroup" filter="url(#subtleGlow)">

        <!-- 1. LEFT BRACKET < -->
        <g id="leftBracket">
            <!-- Top Outer Bevel Strip (Bright yellow-green highlight) -->
            <path d="M 345,100 L 365,118 L 356,110 L 268,192 L 255,192 Z" fill="url(#limeBrightTop)"></path>

            <!-- Upper Arm Front Face -->
            <path d="M 356,110 L 365,118 L 365,138 L 290,192 L 268,192 Z" fill="url(#limeMidFront)"></path>

            <!-- Lower Arm Front Face -->
            <path d="M 268,192 L 290,192 L 365,246 L 365,266 L 356,274 Z" fill="url(#limeShadowFront)"></path>

            <!-- Bottom Outer Bevel Strip -->
            <path d="M 255,192 L 268,192 L 356,274 L 365,266 L 345,284 Z" fill="url(#limeBottomBevel)"></path>

            <!-- Inner Cut Shadow Face -->
            <path d="M 365,138 L 290,192 L 365,246 Z" fill="url(#limeInnerDark)"></path>

            <!-- Subtle Bevel Edge Highlight Lines -->
            <path d="M 345,100 L 255,192 L 345,284" fill="none" stroke="#eefdaa" stroke-width="1.2" stroke-opacity="0.6"></path>
            <path d="M 268,192 L 356,110" fill="none" stroke="#d2ff6b" stroke-width="1" stroke-opacity="0.5"></path>
        </g>


        <!-- 2. CENTER PILLAR / (Purple Slanted Bar) -->
        <g id="centerPillar" filter="url(#purpleGlow)">
            <!-- Top Facet Cap (Light Lavender Highlight) -->
            <path d="M 400,120 L 416,136 L 400,152 L 384,136 Z" fill="url(#purpleTopCap)"></path>

            <!-- Left Face (Dark Plum Shadow) -->
            <path d="M 384,136 L 400,152 L 400,328 L 384,312 Z" fill="url(#purpleLeftShadow)"></path>

            <!-- Right Face (Bright Lavender / Purple Front) -->
            <path d="M 400,152 L 416,136 L 416,312 L 400,328 Z" fill="url(#purpleRightBright)"></path>

            <!-- Bottom Point/Cap -->
            <path d="M 384,312 L 400,328 L 416,312 L 400,344 Z" fill="url(#purpleBottomDark)"></path>

            <!-- Center Ridge Highlight Line -->
            <line x1="400" y1="152" x2="400" y2="328" stroke="#f3d5ff" stroke-width="1.5" stroke-opacity="0.8"></line>
            <path d="M 400,120 L 416,136 L 416,312" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.5"></path>
        </g>


        <!-- 3. RIGHT BRACKET > -->
        <g id="rightBracket">
            <!-- Top Outer Bevel Strip -->
            <path d="M 455,176 L 435,194 L 444,186 L 532,268 L 545,268 Z" fill="url(#limeBrightTop)"></path>

            <!-- Upper Arm Front Face -->
            <path d="M 444,186 L 435,194 L 435,214 L 510,268 L 532,268 Z" fill="url(#limeMidFront)"></path>

            <!-- Lower Arm Front Face -->
            <path d="M 532,268 L 510,268 L 435,322 L 435,342 L 444,350 Z" fill="url(#limeShadowFront)"></path>

            <!-- Bottom Outer Bevel Strip -->
            <path d="M 545,268 L 532,268 L 444,350 L 435,342 L 455,360 Z" fill="url(#limeBottomBevel)"></path>

            <!-- Inner Cut Shadow Face -->
            <path d="M 435,214 L 510,268 L 435,322 Z" fill="url(#limeInnerDark)"></path>

            <!-- Edge Highlight Lines -->
            <path d="M 455,176 L 545,268 L 455,360" fill="none" stroke="#eefdaa" stroke-width="1.2" stroke-opacity="0.6"></path>
            <path d="M 532,268 L 444,186" fill="none" stroke="#d2ff6b" stroke-width="1" stroke-opacity="0.5"></path>
        </g>
    </g>

    <!-- 4. LOGO TYPOGRAPHY SECTION -->
    <g id="logoTextGroup" filter="url(#textReadabilityShadow)">
        <!-- Main Brand Title with high-contrast purple fill & fine outline -->
        <text id="svgMainText" class="ticno-text-main" x="400" y="445" text-anchor="middle" fill="url(#purpleTextGradient)" stroke="#4a0478" stroke-width="0.5" style="paint-order: stroke fill;">
            TICNO DEVELOPERS
        </text>

        <!-- Subtitle / Slogan -->
        <text id="svgSubText" class="ticno-text-sub" x="400" y="485" text-anchor="middle" fill="#8ccf1f" stroke="#1d3d01" stroke-width="0.3">
            SOFTWARE &amp; DIGITAL SOLUTIONS
        </text>
    </g>
</svg>
