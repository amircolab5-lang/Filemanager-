name: Build Release APK + AAB (Phone, Tablet, Fire TV, Android TV)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Ticno File Manager Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Delete Old Artifacts from GitHub
        uses: c-hive/gha-remove-artifacts@v1
        with:
          age: '1 day'
          skip-tags: true
          skip-recent: 2
        continue-on-error: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses & Install Platforms
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "platforms;android-36" "build-tools;35.0.0" || true

      - name: Setup Environment and Keystore
        run: |
          chmod +x gradlew
          if [ -f ".env.example" ]; then
            cp .env.example .env
          else
            touch .env
          fi
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          if [ ! -s "debug.keystore" ]; then
            echo "Generating fresh signing keystore..."
            rm -f debug.keystore
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
          fi

      - name: Build Release APK and AAB Bundle
        run: |
          ./gradlew assembleRelease bundleRelease -x test -x lint --no-daemon --stacktrace --no-configuration-cache
          echo "=== BUILD ARTIFACTS SIZES ==="
          ls -lh app/build/outputs/apk/release/
          ls -lh app/build/outputs/bundle/release/

      - name: Upload Release APK (Phone, Tablet, Fire TV, Android TV ~4.2 MB)
        uses: actions/upload-artifact@v4
        with:
          name: ticno-file-manager-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release AAB Bundle (Google Play & App Stores)
        uses: actions/upload-artifact@v4
        with:
          name: ticno-file-manager-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
